<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | FILEFORGE</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <style>
        :root { --bg:#07090d; --panel:#10141b; --border:#232936; --text:#f4f6fb; --muted:#8992a4; --purple:#8272ff; }
        @media (prefers-color-scheme: light) { :root { --bg:#f2f4f8; --panel:#fff; --border:#e1e5ec; --text:#161a22; --muted:#697386; } }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
               font-family:Inter, "Segoe UI", system-ui, sans-serif; }
        main { max-width:460px; width:100%; text-align:center; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:40px 28px; }
        img { width:56px; height:56px; }
        h1 { font-size:44px; margin:18px 0 6px; }
        p { color:var(--muted); line-height:1.6; margin:0 0 24px; }
        a { display:inline-block; background:var(--purple); color:#fff; text-decoration:none; padding:12px 22px; border-radius:12px; font-weight:600; }
    </style>
</head>
<body>
